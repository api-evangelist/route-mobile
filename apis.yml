  - type: APIReference
    url: https://developer.rmlconnect.net/route-mobile-project/reference/sendmail
  - type: SourceCode
    url: https://github.com/routemobile/Route-Mailer-API
  - type: Documentation
    url: https://routemobile.github.io/Route-Mailer-API/
- aid: route-mobile:route-mobile-enterprise-voice-api
  name: Route Mobile Enterprise Voice 2.0 API
  description: Route Mobile's enterprise voice and cloud telephony surface, documented as
    narrative guides on the developer portal (send message and template management calls)
    and published as a first-party Postman collection in the routemobile GitHub
    organization. No OpenAPI definition is published for voice, unlike the messaging and
    email products; the production host (rmlvoice.rmlconnect.net) and the Click2Call and
    CreateOBDCampaign operations are taken from that first-party Postman collection.
  humanURL: https://developer.rmlconnect.net/route-mobile-project/docs/voice-apis
  baseURL: https://rmlvoice.rmlconnect.net
  tags:
  - Voice
  - Cloud Telephony
  properties:
