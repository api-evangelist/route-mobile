  - type: SourceCode
    url: https://github.com/routemobile/RCS-Business-Messaging-API
  - type: Documentation
    url: https://routemobile.github.io/RCS-Business-Messaging-API/RCS.html
- aid: route-mobile:route-mobile-viber-api
  name: Route Mobile Viber Business Messages API
  description: Viber Business Messages — login, single and bulk message submission (text,
    image, video, file and template messages), campaign management, media upload, summary and
    graph reporting, report generation and download, and a client callback channel for
    delivery receipts and inbound events. 15 documented paths and 16 operations across the
    Viber Login, Client Callback, Business Messaging, Bulk Messaging and Reports tags,
    authenticated with a JWT in the Authorization header.
  humanURL: https://developer.rmlconnect.net/route-mobile-project/docs/viber
  baseURL: https://apis.rmlconnect.net
