aid: route-mobile
url: https://raw.githubusercontent.com/api-evangelist/route-mobile/refs/heads/main/apis.yml
name: Route Mobile
kind: company
description: >-
  Route Mobile Limited is a Mumbai-headquartered cloud communications platform
  (CPaaS) provider and one of India's largest A2P messaging aggregators, listed on the
  BSE and NSE and now majority-owned by Belgium's Proximus Group, where it sits alongside
  BICS and Telesign inside Proximus Global. It sells enterprise messaging (SMS, WhatsApp
  Business Platform, RCS, Viber, Google Business Messages, Telegram, Instagram), OTP and
  identity verification, voice and cloud telephony, transactional email through SendClean,
  URL shortening through Acculync, and a telecom-operator product line (SMSC-as-a-service,
  the Route Shield SMS firewall, Route Hub, and Instant Virtual Numbers) that puts it on
  both sides of the carrier relationship — reselling operator connectivity to enterprises
  while also selling infrastructure back to operators. Its API posture is genuinely
  self-serve and public: a ReadMe-hosted developer portal at developer.rmlconnect.net
  documents roughly 108 REST operations across SMS, WhatsApp, RCS, Viber and email, backed
  by five downloadable OpenAPI 3.0 definitions that are also mirrored in first-party GitHub
  repositories with Postman collections and Redoc pages. That places Route Mobile firmly in
  the CPaaS-aggregator half of telecom rather than the partner-gated operator half. On the
  sector's defining standards question it is thinner than its marketing suggests: nothing in
  its public documentation references CAMARA, GSMA Open Gateway, Number Verification, SIM
  Swap, Device Location or CIBA, and its network-API story lives entirely at the parent
  level, in Proximus Global's Konera aggregation platform announced as "aligned with GSMA's
  CAMARA standardization initiative" — a press release, not a callable Route Mobile
  endpoint. Authentication across its live APIs is legacy-CPaaS rather than telco-standard:
  username and password query parameters for SMS, JWT bearer tokens minted by product-level
  login endpoints for WhatsApp, RCS and Viber, and owner_id plus token in the request body
  for email.
