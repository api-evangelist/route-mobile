    url: https://developer.rmlconnect.net/route-mobile-project/docs/voice-apis
  - type: Documentation
    url: https://developer.rmlconnect.net/route-mobile-project/docs/send-message-voice-apis
  - type: PostmanCollection
    url: https://github.com/routemobile/Enterprise-Voice-2.0-APIs
