apis:
- aid: route-mobile:route-mobile-sms-api
  name: Route Mobile SMS API
  description: Route Mobile's core A2P SMS platform — single, bulk, scheduled and personalised
    SMS submission over HTTPS, credit checks, account details, OTP generation and
    verification, DND/whitelist management, coverage map download, and pre-built submission
    endpoints for the MoEngage and WebEngage marketing platforms. 14 documented operations
    across the Message Sending, Account, OTP and Integrations tags. Authentication is via
    username and password query parameters, with a static Authorization header token used
    for the third-party integration endpoints.
  humanURL: https://developer.rmlconnect.net/route-mobile-project/docs/sms
  baseURL: https://api.rmlconnect.net
  tags:
  - SMS
  - A2P Messaging
  - OTP
  properties:
  - type: OpenAPI
    url: openapi/route-mobile-sms.yml
  - type: Documentation
    url: https://developer.rmlconnect.net/route-mobile-project/docs/sms
  - type: APIReference
    url: https://developer.rmlconnect.net/route-mobile-project/reference/sendsmssecured
  - type: Documentation
    url: https://routemobile.com/api/
- aid: route-mobile:route-mobile-whatsapp-business-api
  name: Route Mobile WhatsApp Business API
  description: Route Mobile is a Meta Business Solution Provider for the WhatsApp Business
    Platform. The API covers JWT login, account management, template and session messaging,
    bulk campaign upload and management, catalog and product-feed management for commerce,
    media ID generation, opt-in management, reporting, and client callback registration —
    33 documented operations across Authentication, Account Management, Messaging, Bulk
    Campaigns, Catalog Management, Reports, Opt-in Management and Webhooks.
  humanURL: https://developer.rmlconnect.net/route-mobile-project/docs/whatsapp
  baseURL: https://apis.rmlconnect.net
  tags:
  - WhatsApp Business
  - Messaging
  - Commerce
  properties:
  - type: OpenAPI
    url: openapi/route-mobile-whatsapp-business.yml
  - type: Documentation
    url: https://developer.rmlconnect.net/route-mobile-project/docs/whatsapp
  - type: APIReference
    url: https://developer.rmlconnect.net/route-mobile-project/reference/sendsessionmessageapi
  - type: SourceCode
    url: https://github.com/routemobile/WhatsApp-Business-API
  - type: Documentation
    url: https://routemobile.github.io/WhatsApp-Business-API/
- aid: route-mobile:route-mobile-rcs-api
  name: Route Mobile RCS Business Messaging API
  description: Rich Communication Services business messaging — verified sender messaging with
    rich cards, carousels and suggested replies, single and bulk message submission, an RCS
    payment/bill-send endpoint, typing events, a file server for media upload, tester and
    agent management, capability checks against handsets, opt-in management and inbound
    callbacks. 18 documented paths and 21 operations, authenticated with a JWT obtained from
    the login endpoint.
  humanURL: https://developer.rmlconnect.net/route-mobile-project/docs/rcs
  baseURL: https://apis.rmlconnect.net
  tags:
  - RCS
  - Messaging
  - Rich Messaging
