  - type: Documentation
    url: https://routemobile.github.io/Viber-Business-Messages-API/
- aid: route-mobile:sendclean-email-api
  name: SendClean Email API
  description: SendClean is Route Mobile's transactional and bulk email product, exposed as a
    JSON-over-HTTP-POST REST API. 24 documented operations covering SMTP user creation and
    password reset, sending-domain and tracking-domain registration and verification, webhook
    registration and key rotation, message send (including template send over HTTP GET),
    message info lookup, error retrieval and account details. Every request carries owner_id
    and token in the request body rather than a header.
  humanURL: https://developer.rmlconnect.net/route-mobile-project/docs/email
  baseURL: https://api.sendclean.net/v1.0
  tags:
  - Email
  - Transactional Email
  - Webhook
