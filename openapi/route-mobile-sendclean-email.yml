  /messages/sendMail:
    post:
      tags:
      - Messages
      summary: Send a transactional email
      description: |
        Sends a new transactional email via the specified SMTP sub-user.

        Either `html` or `text` content is required in the message body (both may be provided).

        Use the `headers` object to control tracking, signing, and routing behaviour.
        Use `X-Unique-Id` in headers to tag messages for later retrieval via `/messages/getMessageInfo`.
      operationId: sendMail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMailRequest'
            example:
              owner_id: example id
              token: example token
              smtp_user_name: smtp12345
              message:
                html: <h1>Hello!</h1><p>Your order is confirmed.</p>
                text: Hello! Your order is confirmed.
                subject: Order Confirmation
                from_email: noreply@yourdomain.com
                from_name: Your Company
                to:
                - email: customer@example.com
                  name: Customer Name
                  type: to
                headers:
                  Reply-To: support@yourdomain.com
                  X-Unique-Id: order-12345
                attachments:
                - type: application/pdf
                  name: invoice.pdf
                  content: ZXhhbXBsZSBmaWxl
      responses:
        '200':
          description: Message queued for delivery
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SendMailResponse'
                - $ref: '#/components/schemas/ErrorResponse'
              examples:
                success:
                  value:
                    status: success
                    message: message have been Queued ...
                error:
                  value:
                    status: error
                    code: -1
                    name: AuthenticationError
                    message: Token MissMatch
  /messages/sendTemplate:
    post:
      tags:
      - Messages
      summary: Send email using a saved template
      description: |
        Sends a transactional email using a pre-created template.
        Use `dynamic_value` to replace template placeholders (case-sensitive field names).
      operationId: sendTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTemplateRequest'
            example:
              owner_id: example id
              token: example token
              smtp_user_name: smtp12345
              message:
                template_id: Template_Id_123
                subject: Welcome to our service
                from_email: noreply@yourdomain.com
                from_name: Your Company
                to:
                - email: customer@example.com
                  name: Customer Name
                  type: to
                dynamic_value:
                  NAME: John
                  Email: customer@example.com
                headers:
                  Reply-To: support@yourdomain.com
                  X-Unique-Id: welcome-john-001
      responses:
        '200':
          description: Template message queued
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SendMailResponse'
                - $ref: '#/components/schemas/ErrorResponse'
              examples:
                success:
                  value:
                    status: success
                    message: 250 Message Queued...
  /messages/sendTemplateHTTPGet:
    get:
      tags:
      - Messages
      summary: Send template email via HTTP GET
      description: |
        Sends a transactional email using a template via HTTP GET. Designed for simple integrations
        such as IVR webhooks where POST with JSON body is not practical.

        **All parameter values must be URL-encoded.**

        Example:
        ```
        GET https://api.sendclean.net/v1.0/messages/sendTemplateHTTPGet?owner_id=YOUR_ID&token=YOUR_TOKEN
            &smtp_user_name=smtp12345&template_id=TMPL_ID&subject=Hello
            &from_email=info%40example.com&to=customer%40example.com
            &dynamic_value%5BNAME%5D=John&dynamic_value%5BEmail%5D=john%40example.com
        ```
      operationId: sendTemplateHTTPGet
      parameters:
      - name: owner_id
        in: query
        required: true
        schema:
          type: string
        description: A valid SendClean User ID
      - name: token
        in: query
        required: true
        schema:
          type: string
        description: A valid API token
      - name: smtp_user_name
        in: query
        required: true
        schema:
          type: string
        description: A valid SMTP user name
        example: smtp12345
      - name: template_id
        in: query
        required: true
        schema:
          type: string
        description: Previously created template ID
      - name: subject
        in: query
        required: true
        schema:
          type: string
        description: URL-encoded email subject
      - name: from_email
        in: query
        required: true
        schema:
          type: string
        description: URL-encoded sender email address
      - name: to
        in: query
        required: true
        schema:
          type: string
        description: URL-encoded recipient email address
      - name: dynamic_value[NAME]
        in: query
        required: false
        schema:
          type: string
        description: URL-encoded dynamic value for NAME placeholder
      - name: dynamic_value[Email]
        in: query
        required: false
        schema:
          type: string
        description: URL-encoded dynamic value for Email placeholder
      responses:
        '200':
          description: Template message queued
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SendMailResponse'
                - $ref: '#/components/schemas/ErrorResponse'
              examples:
                success:
                  value:
                    status: success
                    message: 250 Message Queued...
