          description: "The type of event or message. \n"
        message_id:
          type: string
          description: "The unique identifier for the message that is being reported for its status. \n"
        message_status:
          type: string
          description: 'The status of the message.

            '
        timestamp:
          type: string
          description: 'The timestamp of when the message was received or sent.

            '
        user_contact:
          type: string
          description: 'The contact information of the user.

            '
        extra:
          type: string
          description: 'Additional information or parameters related to the payment.

            '
        username:
          type: string
          description: 'The name of the user.

            '
      required:
      - bot_name
      - event_type
      - message_id
      - message_status
      - failure_reason
      - timestamp
      - user_contact
      - extra
      - username
    rcs_callback_incoming_suggestion_reply:
      type: object
      title: Incoming Suggestion Reply
      properties:
        bot_name:
          type: string
          description: 'The name of the bot.

            '
        event_type:
          type: string
          description: 'The type of event or message. For a suggestion reply, it is set to "response".

            '
        request_id:
          type: string
          description: 'The unique identifier for the original request or message.

            '
        response_postback:
          type: string
          description: 'The postback value associated with the suggestion reply.

            '
        response_text:
          type: string
          description: 'The text response provided by the user for the suggestion.

            '
        session_id:
          type: string
          description: 'The session identifier for the conversation or interaction. It helps to associate multiple messages from the same user or session.

            '
        suggestion_type:
          type: string
          description: "The type of suggestion used by the user. \n"
        timestamp:
          type: string
          description: 'The timestamp of when the message was received or sent.

            '
        user_contact:
          type: string
          description: 'The contact information of the user.

            '
        username:
          type: string
          description: 'The name of the user.

            '
