              description: The type of message template. For sending a media template message, set to
                "media_template".
            template_name:
              type: string
              description: The name of the template to use.
            lang_code:
              type: string
              description: Language code of language in which message text is written, such as "en" for
                English.
            body:
              type: array
              description: An array of objects representing the body of the template.
              items:
                type: object
                properties:
                  text:
                    type: string
                    description: The text to include in the message. The actual values are replaced with
                      variables.
                required:
                - text
            button:
              type: array
              description: The button section specifies the details of the call-to-action buttons that
                can be added to the message.
              items:
                type: object
                properties:
                  button_no:
                    type: string
                    description: The button number; the value is either "0" or "1".
                  url:
                    type: string
                    description: The URL to include in the button. The key can be a static or dynamic
                      URL variable.
                required:
                - button_no
                - url
          required:
          - type
          - template_name
          - lang_code
      required:
      - phone
      - media
