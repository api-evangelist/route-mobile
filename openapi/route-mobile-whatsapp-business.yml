    CreateProductFeedRequest:
      type: object
      properties:
        file_url:
          type: string
          description: The URL of the file that contains the product feed, hosted publicly and starting
            with "https://" and ending with the file extension.
          example: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx=
        name:
          type: string
          description: The name of the product feed.
          example: product_feed_name
        schedule:
          type: string
          description: |-
            The schedule for updating the product feed. It contains a JSON object with two keys:

            a. interval: This key specifies the interval at which the product feed should be updated. In this case, it is set to "HOURLY", indicating that the feed should be updated hourly.

            b. scheduled_time: This key specifies the date and time at which the first update of the product feed should occur, in UTC format.
          example: ' "\"interval\":\"HOURLY\",\"scheduled_time\":\"2022-09-06 11:38:00\""'
      required:
      - file_url
      - name
    FetchProductFeedResponse:
      type: object
      properties:
        file_url:
          type: string
          description: The URL of the file that contains the updated product feed, hosted publicly and
            starting with "https://" and ending with the file extension.
        product_feed_id:
          type: string
          description: The unique ID of the product feed that is fetched
        name:
          type: string
          description: The name of product feed fetched
          example: Maggy
        id:
          type: string
          description: The id of product feed fetched
          example: '922943435434'
        price:
          type: string
          description: The price of product feed fetched
          example: '25.00'
        description:
          type: string
          description: The description of product feed fetched
          example: Instant noodles
        retailer_id:
          type: string
          description: The retailer id of product feed fetched
          example: IT158
        next_url:
          type: string
          description: The next url of product feed fetched
          example: xxxxxxxxxxxxxxxxxxxxxxxx/v1/fetch_product_feed?access_token=xxxxxxxxxxxxxxxxxxxxxxx&limit=10&fields=name,id,price,description,retailer_id&product_feed_id=xxxxxxxxxxx&after=xxxxxxxxxxxxxx&before=
        prev_url:
          type: string
          description: The previous url of product feed fetched
          example: xxxxxxxxxxxxxxxxxxxxxx/v1/fetch_product_feed?access_token=xxxxxxxxxxxxxxxxxxxxxxx&limit=10&fields=name,id,price,description,retailer_id&product_feed_id=xxxxxxxxxxx&before=xxxxxxxxxxxxxx&before=
      required:
      - file_url
      - product_feed_id
      - name
      - id
      - price
      - description
      - retailer_id
      - next_url
      - prev_url
    UpdateProductFeedRequest:
      type: object
      properties:
        file_url:
