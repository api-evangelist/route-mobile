        from a business.
      operationId: optindownload
      parameters:
      - name: from_date
        in: query
        description: The starting date of the user opt-ins for receiving messages.
        required: true
        schema:
          type: string
          format: date
          example: '2023-08-07'
      - name: to_date
        in: query
        description: The end date of the user opt-ins for receiving messages.
        required: true
        schema:
          type: string
          format: date
          example: '2023-08-07'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of the optin create report.
                  id:
                    type: integer
                    description: The unique identifier that represents the report.
              examples:
                Example 1:
                  value:
                    status: success
                    id: 5748
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The response message.
                  reason:
                    type: string
                    description: The reason for not generating the optin create report.
                  status:
                    type: string
                    description: The status of the report.
              examples:
                Example 1:
                  value:
                    message: unable to process campaign request
                    reason: jwt token expired
                    status: failure
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The response message.
              examples:
                Example 1:
                  value:
                    message: The requested URL was not found on the server. If you entered the URL manually
                      please check your spelling and try again.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The response message.
                  reason:
                    type: string
                    description: The reason for not generating the option create report.
                  status:
                    type: string
                    description: The status of the report.
              examples:
                Example 1:
                  value:
                    status: failure
                    message: unable to process request
                    reason: internal server error
      security:
      - BearerAuth: []
