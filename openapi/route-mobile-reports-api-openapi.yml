        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        template_count:
                          type: integer
                          description: The template count number.
                        template_name:
                          type: string
                          description: The template name.
              examples:
                Example 1:
                  value:
                    result:
                    - template_count: 8
                      template_name: bilan
                    - template_count: 3
                      template_name: bmntest12
                    - template_count: 1
                      template_name: delhi_metro_english_quick_n
                    - template_count: 4
                      template_name: demo202
                    - template_count: 7
                      template_name: xyzz888
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The response message.
                  reason:
                    type: string
                    description: The reason for not processing the template count request.
                  status:
                    type: string
                    description: The status of the template count request.
              examples:
                Example 1:
                  value:
                    message: unable to process campaign request
                    reason: jwt token expired
                    status: failure
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The response message.
              examples:
                Example 1:
                  value:
                    message: The requested URL was not found on the server. If you entered the URL manually please check your spelling and try again.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The message response.
                  reason:
                    type: string
                    description: The reason for not processing the template count request.
                  status:
                    type: string
                    description: The status of the template count request.
              examples:
                Example 1:
                  value:
                    status: failure
                    message: unable to process request
                    reason: internal server error
      security:
      - BearerAuth: []
components:
  schemas:
    CampaignDetail:
      type: object
      properties:
        campaign_id:
          type: string
          description: The unique identifier for the campaign.
        campaign_name:
          type: string
          description: The name of the campaign.
        campaign_status:
          type: string
          description: The status of the campaign.
        campaign_type:
          type: string
          description: The type of the campaign.
        delivered:
          type: integer
          description: Number of delivered messages.
        failed:
          type: integer
          description: Number of failed messages.
        message_payload:
          $ref: '#/components/schemas/CampaignMessagePayload'
        message_type:
          type: string
          description: The type of the message.
        process_end_timestamp:
          type: string
          description: The process end time.
        process_start_timestamp:
          type: string
          description: The process start time.
        read:
          type: integer
          description: Number of read messages.
        scheduled_time:
          type: string
          description: The campaign scheduled time.
        sent:
          type: integer
          description: Number of sent messages.
        submit:
          type: integer
          description: Number of submitted messages.
        user_name:
          type: string
          description: The name of the user.
    CampaignReportFilters:
      type: object
      description: An object containing the filters to apply to the report.
      properties:
        campaign_id:
          type: string
          description: The ID of the campaign for which to generate the report.
          example: '{campaign-id}'
        campaign_name:
          type: string
          description: The name of the campaign for which to generate the report.
          example: '{campaign-name}'
        end_date:
          type: string
          description: The end date for the campaign specific report in "YYYY-MM-DD" order, followed by the time in the "HH:MM:SS" format.
          example: '{end-date}'
        start_date:
          type: string
          description: The start date for the campaign specific report in "YYYY-MM-DD" order, followed by the time in the "HH:MM:SS" format.
          example: '{start-date}'
      required:
      - campaign_id
      - campaign_name
      - end_date
      - start_date
    CampaignMessagePayloadMedia:
      type: object
      properties:
        lang_code:
          type: string
          description: Language code of language in which message text is written, such as "en" for English.
        template_name:
          type: string
          description: The name of the message template.
        type:
          type: string
          description: The template type.
    CreateReportRequest:
      type: object
      properties:
        csv_max_lines:
          type: number
          description: An integer representing the maximum number of lines to include in the CSV file.
          example: 10000
        filters:
          $ref: '#/components/schemas/ReportFilters'
        projections:
          type: array
          description: An array of fields that you want to include in the report.
          items:
            type: string
            example: country_code
          example:
          - country_code
          - msisdn
          - message_type
          - message_payload
          - request_id
          - conversation_id
          - message_id
          - submit_timestamp
          - sent_timestamp
          - delivery_timestamp
          - read_timestamp
          - failed_timestamp
          - deleted_timestamp
          - extra
          - pricing_model
      required:
      - csv_max_lines
      - filters
      - projections
    ReportFilters:
      type: object
      description: A JSON object that contains the start and end dates for the report. The format of the dates should be in YYYY-MM-DD format.
      properties:
        end_date:
          type: string
          description: The end date for the report in "YYYY-MM-DD" order, followed by the time in the "HH:MM:SS" format.
          example: '{end-date}'
        start_date:
          type: string
          description: The start date for the report in "YYYY-MM-DD" order, followed by the time in the "HH:MM:SS" format.
          example: '{start-date}'
      required:
      - end_date
      - start_date
    InvalidStartDateError:
      type: object
      properties:
        status:
          type: string
          description: The status of the report.
        errors:
          type: object
          description: The error message details.
          properties:
            filters:
              type: object
              description: A JSON object that contains the start date for the report.
              properties:
                start_date:
                  type: array
                  description: The start date for the report in the format of YYYY-MM-DD.
                  items:
                    type: string
    CampaignMessagePayload:
      type: object
      properties:
        country_code:
          type: string
          description: The country code.
        media:
          $ref: '#/components/schemas/CampaignMessagePayloadMedia'
        phone:
          type: string
          description: The phone number in international format.
    JwtExpiredError:
      type: object
      properties:
        message:
          type: string
          description: The response message.
        reason:
          type: string
          description: The reason for not processing the product feed update request.
        status:
          type: string
          description: The status of the product feed update.
    InvalidEndDateError:
      type: object
      properties:
        status:
          type: string
          description: The status of the report.
        errors:
          type: object
          description: The error message details.
          properties:
            filters:
              type: object
              description: A JSON object that contains the end date for the report.
              properties:
                end_date:
                  type: array
                  description: The end date for the report in the format of YYYY-MM-DD.
                  items:
                    type: string
    CampaignDetailsResponse:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/CampaignDetail'
    NotFoundError:
      type: object
      properties:
        message:
          type: string
          description: The message response.
    CreateCampaignReportRequest:
      type: object
      properties:
        csv_max_lines:
          type: number
          description: An integer representing the maximum number of lines to include in the CSV file.
          example: 10000
        filters:
          $ref: '#/components/schemas/CampaignReportFilters'
        projections:
          type: array
          description: An array of strings representing the fields to include in the report.
          items:
            type: string
            example: '"country_code", "msisdn", "message_type", "message_payload", "request_id", "conversation_id", "message_id", "submit_timestamp", "sent_timestamp", "delivery_timestamp", "read_timestamp", "failed_timestamp", "deleted_timestamp", "extra", "pricing_model", "scheduled_time"'
          example:
          - country_code
          - msisdn
          - message_type
          - message_payload
          - request_id
          - conversation_id
          - message_id
          - submit_timestamp
          - sent_timestamp
          - delivery_timestamp
          - read_timestamp
          - failed_timestamp
          - deleted_timestamp
          - extra
          - pricing_model
          - scheduled_time
      required:
      - csv_max_lines
      - filters
      - projections
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JSON Web Token obtained from the Login API. Include the token in the `Authorization` header as `Bearer <token>`. Tokens expire after one hour by default.
x-readme:
  explorer-enabled: true
  proxy-enabled: true
  samples-enabled: true
