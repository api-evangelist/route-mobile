  /viber-report-creator/v1/create_report:
    post:
      tags:
      - Viber Reports API
      summary: Create Report
      description: Triggers the generation of a new downloadable report for a given date range. The report is created asynchronously — use the Fetch Reports endpoint to check status, then the Download Report endpoint once the status is `completed`.
      operationId: createReport
      x-readme:
        samples-languages:
        - curl
        - python
        - node
        - java
        - php
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vbs_report_create'
            examples:
              Create date-range report:
                value:
                  start_date: '2025-01-23 00:00:00'
                  end_date: '2026-01-23 00:00:00'
                  filters:
                    message_type: all
                    service_type: all
                  projections:
                  - phone_number
                  - message_type
                  - status
                  - sent_at
                  - request_id
      responses:
        '200':
          description: Report creation initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_id:
                    type: integer
                    description: ID of the newly created report job.
                  status:
                    type: string
                    description: Initial status of the report (e.g. `pending`).
              examples:
                Report created:
                  value:
                    report_id: 42
                    status: pending
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                Missing date range:
                  value:
                    error: start_date and end_date are required.
        '401':
          description: Authentication Failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
              examples:
                Unauthorized:
                  value:
                    response: Unauthorized
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  retry_after:
                    type: integer
              examples:
                Rate limit exceeded:
                  value:
                    status: error
                    retry_after: 60
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Server error:
                  value:
                    status: error
                    message: Unknown error occured while processing request
      security:
      - jwt: []
  /viber-report-creator/v1/download/{file_name}:
    get:
      tags:
      - Viber Reports API
      summary: Download Report
      description: Downloads a generated report file by its file name. The file name is obtained from the `file_path` field in the Fetch Reports response. The report is returned as a ZIP archive containing a CSV file.
      operationId: downloadReport
      x-readme:
        samples-languages:
        - curl
        - python
        - node
        - java
        - php
      parameters:
      - name: file_name
        in: path
        required: true
        schema:
          type: string
        description: The file name of the report to download (e.g. `6e36bde0-eb93-11f0-b4b9-0242ac11000c.zip`).
        example: 6e36bde0-eb93-11f0-b4b9-0242ac11000c.zip
      responses:
        '200':
          description: Report file download
          content:
            application/zip:
              schema:
                type: string
                format: binary
                description: ZIP archive containing the report CSV file.
        '401':
          description: Authentication Failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
              examples:
                Unauthorized:
                  value:
                    response: Unauthorized
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                Not found:
                  value:
                    error: Report file not found.
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  retry_after:
                    type: integer
              examples:
                Rate limit exceeded:
                  value:
                    status: error
                    retry_after: 60
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Server error:
                  value:
                    status: error
                    message: Unknown error occured while processing request
      security:
      - jwt: []
components:
  schemas:
    vbs_template_create:
      type: object
      title: Create Template
      required:
      - template_name
      - template_syntax
      - message_type
      - operator_template_id
      properties:
        template_name:
          type: string
          description: A unique name for the template.
        template_syntax:
          type: string
          description: The template message text. Use {{parameter_name}} syntax for variable placeholders.
        message_type:
          type: string
          description: The type of template (e.g. "viber_otp", "text_template").
        operator_template_id:
          type: string
          description: The operator-assigned template ID provided by Viber.
    vbs_report_create:
      type: object
      title: Create Report Request
      required:
      - start_date
      - end_date
      properties:
        start_date:
          type: string
          description: Start date and time for the report range (YYYY-MM-DD HH:MM:SS).
        end_date:
          type: string
          description: End date and time for the report range (YYYY-MM-DD HH:MM:SS).
        filters:
          type: object
          description: Optional filters to apply to the report data.
          properties:
            message_type:
              type: string
              description: Filter by message type (e.g. "text", "image", "all").
            service_type:
              type: string
              description: Filter by service type (e.g. "one_way", "two_way", "all").
        projections:
          type: array
          description: List of fields to include in the report CSV.
          items:
            type: string
  securitySchemes:
    jwt:
      type: apiKey
      name: Authorization
      in: header
