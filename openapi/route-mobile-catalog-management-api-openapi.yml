components:
  schemas:
    CatalogAuthError:
      type: object
      properties:
        message:
          type: string
          description: The response message.
        status:
          type: string
          description: The status of the message.
        reason:
          type: string
          description: The reason for not processing the message.
    UpdateProductFeedRequest:
      type: object
      properties:
        file_url:
          type: string
          description: The URL of the file that contains the updated product feed, hosted publicly and starting with "https://" and ending with the file extension.
        product_feed_id:
          type: string
          description: The unique ID of the product feed that should be updated.
        schedule:
          type: string
          description: 'The schedule for recurrently updating the product feed. It contains a JSON object with two keys:


            a. interval: This key specifies the interval at which the product feed should be updated. In this case, it is set to "HOURLY", indicating that the feed should be updated hourly.


            b. scheduled_time: This key specifies the date and time at which the first update of the product feed should occur, in UTC format.'
          example: ' "\"interval\":\"HOURLY\",\"scheduled_time\":\"2022-09-06 11:38:00\""'
      required:
      - file_url
      - product_feed_id
    DeleteProductFeedRequestAlt:
      type: object
      properties:
        product_feed_id:
          type: string
          description: Specify the identification of the product feed to delete from WhatsApp business messaging APIs.
    DeleteProductFeedRequest:
      type: object
      properties:
        product_feed_id:
          type: string
          description: The unique ID of the product feed that should be deleted.
      required:
      - product_feed_id
    JwtExpiredError:
      type: object
      properties:
        message:
          type: string
          description: The response message.
        reason:
          type: string
          description: The reason for not processing the product feed update request.
        status:
          type: string
          description: The status of the product feed update.
    CatalogUnauthorizedError:
      type: object
      properties:
        response:
          type: string
          description: The response message.
    CreateProductFeedRequest:
      type: object
      properties:
        file_url:
          type: string
          description: The URL of the file that contains the product feed, hosted publicly and starting with "https://" and ending with the file extension.
          example: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx=
        name:
          type: string
          description: The name of the product feed.
          example: product_feed_name
        schedule:
          type: string
          description: 'The schedule for updating the product feed. It contains a JSON object with two keys:


            a. interval: This key specifies the interval at which the product feed should be updated. In this case, it is set to "HOURLY", indicating that the feed should be updated hourly.


            b. scheduled_time: This key specifies the date and time at which the first update of the product feed should occur, in UTC format.'
          example: ' "\"interval\":\"HOURLY\",\"scheduled_time\":\"2022-09-06 11:38:00\""'
      required:
      - file_url
      - name
    NotFoundError:
      type: object
      properties:
        message:
          type: string
          description: The message response.
    CatalogUploadRequest:
      type: object
      properties:
        action:
          type: string
          description: The action to be taken on the catalog.
          example: Update
        file:
          type: string
          description: "The data of the product feed file that contains catalog details such as ID, name, and image URL. \nSee the sample [catalog file](https://github.com/routemobile/WhatsApp-Business-API/blob/master/Sample%20Catalog%20File.csv) for more information on catalog details and its format."
          example: ABC.csv
        file_name:
          type: string
          description: The name of the product feed file that contains the updated catalog.
          example: file_name
      required:
      - action
      - file
      - file_name
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JSON Web Token obtained from the Login API. Include the token in the `Authorization` header as `Bearer <token>`. Tokens expire after one hour by default.
x-readme:
  explorer-enabled: true
  proxy-enabled: true
  samples-enabled: true
