      description: The header section of a template is a JSON string consisting of a set of mandatory keys that define text or multimedia messages.
      properties:
        example:
          type: string
          description: Example of header message URL.
          example: '{sample media url}'
        type:
          type: string
          description: Type set to header message format.
          example: image/video/document
    SendSessionPaymentWithCatalog:
      type: object
      title: Payment Message with catalog ID
      properties:
        phone:
          type: string
          description: The mobile number of the recipient in full international format includes a plus sign (+) followed by the country code.
        enable_acculync:
          type: boolean
          description: A boolean indicating whether or not to enable Acculync.
        body:
          type: string
          description: The body text of the message.
        footer:
          type: string
          description: The text to display in the footer.
        image:
          type: object
          description: The image object containing the URL of the image.
          properties:
            url:
              type: string
              description: The URL of the image to display.
        payment:
          type: object
          description: The payment object containing information about the payment details.
          properties:
            reference_id:
              type: string
              description: The reference ID for the payment.
            order_type:
              type: string
              description: The type of order, e.g., "order_details".
            product_type:
              type: string
              description: The type of product, e.g., "digital-goods".
            payment_configuration:
              type: string
              description: The payment configuration ID.
            address:
              type: object
              description: The address object containing recipient's address details.
              properties:
                first_name:
                  type: string
                  description: The first name of the recipient.
                address_line1:
                  type: string
                  description: The first line of the address.
                address_line2:
                  type: string
                  description: The second line of the address.
                city:
                  type: string
                  description: The city of the recipient.
                state:
                  type: string
                  description: The state of the recipient.
                country:
                  type: string
                  description: The country of the recipient.
                postal_code:
                  type: string
                  description: The postal code of the recipient.
            items:
              type: array
              description: An array of item objects containing details about the items in the order.
              items:
                type: object
                properties:
                  retailer_id:
                    type: string
                    description: The retailer ID for the item.
                  catalog_id:
                    type: string
                    description: The catalog ID containing the product.
                  product_name:
                    type: string
                    description: The name of the product.
                  amount:
                    type: number
                    description: The amount for the product.
                  quantity:
                    type: string
                    description: The quantity of the product.
                  expiration_timestamp:
                    type: string
                    description: The expiration timestamp for the product.
                  expiration_description:
                    type: string
                    description: The description of the product's expiration.
            subtotal_amount:
              type: number
              description: The subtotal amount for the order.
            discount_amount:
              type: number
              description: The discount amount for the order.
            discount_description:
              type: string
              description: The description of the discount.
            shipping_amount:
              type: number
              description: The shipping amount for the order.
            shipping_description:
              type: string
              description: The description of the shipping.
            total_amount:
              type: number
              description: The total amount for the order.
            tax_amount:
              type: number
              description: The tax amount for the order.
            tax_description:
              type: string
              description: The description of the tax.
        extra:
          type: string
          description: Additional information to include in the message.
      required:
      - phone
      - body
      - footer
      - image
      - payment
      - extra
    TemplateComponentBody:
      type: object
      description: WhatsApp message body.
      properties:
        text:
          type: string
          description: The text of the WhatsApp message that you want to send.
          example: '{body text}'
    MessageNotFoundError:
      type: object
      properties:
        message:
          type: string
          description: The response message.
    SendSessionSingleProduct:
      type: object
      title: Session Single Product
      properties:
        phone:
          type: string
          description: The mobile number of the recipient in full international format includes a plus sign (+) followed by the country code.
        extra:
          type: string
          description: Additional information to include in the message.
        enable_acculync:
          type: boolean
          description: A boolean indicating whether or not to enable Acculync.
        catalog:
          type: object
          description: The catalog object containing information about the product list.
          properties:
            type:
              type: string
              description: The type of catalog, in this case "Product".
            body:
              type: object
              description: An object containing the "text" parameter.
              properties:
                text:
                  type: string
                  description: A string that describes the product.
              required:
              - text
            action:
              type: object
              description: The action object containing information about the products.
              properties:
                catalog_id:
                  type: string
                  description: The unique ID of the catalog that contains the product.
                product_retailer_id:
                  type: string
                  description: The ID of the product within the catalog.
              required:
              - catalog_id
              - product_retailer_id
          required:
          - type
          - body
          - action
      required:
      - phone
      - catalog
