          type: string
          description: Additional information to include in the message.
        media:
          type: object
          description: An object containing the message template details.
          properties:
            type:
              type: string
              description: The type of message template. For sending a media template message, set to "media_template".
            lang_code:
              type: string
              description: Language code of language in which message text is written, such as "en" for English.
            template_name:
              type: string
              description: The name of the template to use.
            header:
              type: array
              description: The header section of the message template.
              items:
                type: object
                properties:
                  image:
                    type: object
                    description: An object representing the image to include in the header. This object includes 'link' and 'file_name'.
                    properties:
                      link:
                        type: string
                        description: The URL of the image file, hosted publicly and starting with "https://" and ending with the file extension, such as ".png".
            body:
              type: array
              description: The body section of the message template.
              items:
                type: object
                properties:
                  text:
                    type: object
                    description: An object representing the plain text to be included  in the body'.
            button:
              type: array
              description: The button section of the message template.
              items:
                type: object
                properties:
                  button_no:
                    type: string
                    description: The button number; the value is either "0" or "1".
                  payload:
                    type: string
                    description: An object representing the message to be sent
