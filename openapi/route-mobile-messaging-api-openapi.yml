      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/UpdateTemplateExample'
              - $ref: '#/components/schemas/UpdateTemplateLimitedTimeOffer'
              - $ref: '#/components/schemas/UpdateTemplateMultiProduct'
              - $ref: '#/components/schemas/UpdateTemplateAuthAutofill'
              - $ref: '#/components/schemas/UpdateTemplateCatalog'
              - $ref: '#/components/schemas/UpdateTemplateCopyCode'
              - $ref: '#/components/schemas/UpdateTemplateCarousel'
            examples:
              Example:
                value:
                  template_name: test_vid2
                  components:
                    body:
                      text: WELCOME TO TECH
              Auth Autofill:
                value:
                  template_name: '{template_name}'
                  language:
                  - '{lang code}'
                  template_type: template
                  template_category: AUTHENTICATION
                  components:
                    body:
                      add_security_recommendation: true/false
                    footer:
                      code_expiration_minutes:
                        upto 90 mins possible: string
                    buttons:
                      type: OTP
                      otp_type: ONE_TAP
                      text: Copy Code
                      autofill_text: Autofill
                      package_name: '{package name of App}'
                      signature_hash: '{signature_hash of App}'
              Catalog:
                value:
                  template_name: '{template name}'
                  language:
                  - en
                  template_category: MARKETING
                  template_type: template
                  components:
                    body:
                      text: Now shop for your favourite products right here on WhatsApp! Get Rs {{1}} off on all orders
                      example:
