components:
  schemas:
    CreateTemplateCatalog:
      type: object
      title: Catalog Template
      properties:
        template_name:
          type: string
          description: Name of the template.
        language:
          type: array
          description: Language code of language in which message text is written, such as "en" for English.
          items:
            type: string
        template_type:
          type: string
          description: The type of media template that WhatsApp allows.
        template_category:
          type: string
          description: 'The category of the template. Must be one of: MARKETING, UTILITY, AUTHENTICATION.'
        components:
          type: object
          description: Object containing the components of the template.
          properties:
            body:
              type: object
              description: The body component of the template.
              properties:
                text:
                  type: string
                  description: Plain text describing body of the catalog template.
                example:
                  type: string
                  description: Example of text written in body for catalog template.
            footer:
              type: object
              description: The footer component of the template.
              properties:
                code_expiration_minutes:
                  type: object
                  description: The duration in minutes until the code provided in the template expires.
                  properties:
                    upto 90 mins possible:
                      description: The default is 90 minutes.
            buttons:
              type: object
              description: The buttons component of the template.
              properties:
                type:
                  type: string
                  description: Type of button, which should be "call_to_action".
                elements:
                  type: string
                  description: The elements of a button to be added for button type "call_to_action".
                  properties:
                    type:
                      type: string
                      description: The text that appears on the button. In this example, it is set to "view_catalog".
    MessageAcceptedResponse:
      type: object
      description: Every SUCCESS request sends a JSON response with the key as status, message, and request_id.
      properties:
        message:
          type: string
          description: The response message.
        status:
          type: string
          description: The status of the message delivery.
        request_id:
          type: string
          description: The request ID of the message.
    SendTemplateCouponCode:
      type: object
      title: Copy Code
      properties:
